name: Auto Clean & Update TOML 🚀

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  update-and-clean-toml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties


      - name: Remove unused dependencies
        run: ./gradlew buildHealth --fix || true

      - name: Run Catalog Update
        run: ./gradlew versionCatalogUpdate

      # ۵. ساخت Pull Request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: 🧹 Clean unused deps & update libs.versions.toml'
          title: '🤖⚡ Clean Unused Deps & Update Catalog'
          branch: 'auto-update-toml'
          delete-branch: true