name: Auto Optimizer TOML 🚀

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  update-and-clean-toml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Remove unused dependencies
        run: ./gradlew buildHealth --fix

      - name: Run Catalog Update
        run: ./gradlew versionCatalogUpdate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: 🧹 Clean unused deps & update libs.versions.toml'
          title: '🤖⚡ Clean Unused Deps & Update Catalog'
          branch: 'auto-update-toml'
          delete-branch: true