name: Auto Update TOML (2-Day Check)

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  update-toml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Catalog Update
        run: ./gradlew versionCatalogUpdate

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: ⚡ Auto update libs.versions.toml'
          title: '🤖⚡ Auto Update Dependencies (2-Day Check)'
          branch: 'auto-update-toml'
          delete-branch: true