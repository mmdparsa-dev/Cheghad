name: PR Verification

on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - '**/*.gradle*'
      - 'gradle/**'
      - '**/*.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pr-check-gate 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create dummy google-services.json
        run: |
          mkdir -p app/
          echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.mmdparsadev.cheghad"}}}]}' > app/google-services.json

      - name: Run Checks and Build
        run: ./gradlew check -x processDebugGoogleServices -x processReleaseGoogleServices --no-daemon
