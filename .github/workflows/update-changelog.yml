name: Update Changelog on Release

on:
  release:
    types: [published]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Prepend Release Notes to CHANGELOG.md
        env:
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          TITLE=${RELEASE_TITLE:-$RELEASE_TAG}

          # ذخیره امن بدنه ریلیز در فایل موقت جهت جلوگیری از باگ Multiline
          echo "$RELEASE_BODY" > body.tmp

          # اگر CHANGELOG وجود ندارد آن را بساز
          if [ ! -f CHANGELOG.md ]; then
            echo -e "# Changelog\n" > CHANGELOG.md
          fi

          # ساخت بلوک جدید
          {
            echo "## [$TITLE] - $RELEASE_DATE"
            echo ""
            cat body.tmp
            echo ""
            echo ""
          } > new_entry.tmp

          # اگر فایل با # Changelog شروع شده، متن جدید بعد از خط اول اضافه شود
          if grep -q "^# Changelog" CHANGELOG.md; then
            {
              head -n 2 CHANGELOG.md
              cat new_entry.tmp
              tail -n +3 CHANGELOG.md
            } > CHANGELOG.tmp
          else
            # اگر تیتر اصلی نداشت، متن جدید را به ابتدای کل فایل بچسبان
            cat new_entry.tmp CHANGELOG.md > CHANGELOG.tmp
          fi

          mv CHANGELOG.tmp CHANGELOG.md
          rm -f body.tmp new_entry.tmp

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add CHANGELOG.md
          # بررسی اینکه آیا تغییری برای کامیت وجود دارد یا خیر
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update CHANGELOG.md for ${{ github.event.release.tag_name }} [skip ci]"
            git push origin HEAD:${{ github.event.release.target_commitish }}
          fi