name: Update Changelog on Release

on:
  release:
    types: [published]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Prepend Release Notes to CHANGELOG.md
        env:
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          TITLE=${RELEASE_TITLE:-$RELEASE_TAG}

          printf "%s\n" "$RELEASE_BODY" > body.tmp

          if [ ! -f CHANGELOG.md ]; then
            echo -e "# Changelog\n" > CHANGELOG.md
          fi

          {
            echo "## [$TITLE] - $RELEASE_DATE"
            echo ""
            cat body.tmp
            echo ""
            echo ""
          } > new_entry.tmp

          if grep -q "^# Changelog" CHANGELOG.md; then
            python3 -c '
          import sys
          with open("CHANGELOG.md", "r") as f:
              lines = f.readlines()
          with open("new_entry.tmp", "r") as f:
              new_content = f.read()
          
          header = lines[0] if lines else "# Changelog\n"
          rest = "".join(lines[1:]).lstrip()
          
          with open("CHANGELOG.md", "w") as f:
              f.write(header + "\n" + new_content + rest)
          '
          else
            cat new_entry.tmp CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          fi

          rm -f body.tmp new_entry.tmp

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update CHANGELOG.md for ${{ github.event.release.tag_name }} [skip ci]"
            TARGET_BRANCH="${{ github.event.release.target_commitish }}"
            git fetch origin "$TARGET_BRANCH" || true
            git push origin "HEAD:$TARGET_BRANCH"
          fi
