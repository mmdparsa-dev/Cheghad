name: Build & Attach Signed Release

on:
  release:
    types: [published, created, prereleased]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-build:
    name: Signed Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Direct & Store Release APKs
        run: ./gradlew assembleDirectRelease assembleStoreRelease -x validateSigningDirectRelease -x validateSigningStoreRelease -x lint -x test --no-daemon

      - name: Sign Release APKs
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)

          DIRECT_RAW=$(find app/build/outputs/apk/direct/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$DIRECT_RAW" Cheghad-release.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks keystore.jks \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out Cheghad-release.apk Cheghad-release.apk

          STORE_RAW=$(find app/build/outputs/apk/store/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$STORE_RAW" Cheghad-store-release.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks keystore.jks \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out Cheghad-store-release.apk Cheghad-store-release.apk

          rm keystore.jks

      - name: Attach APKs to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            Cheghad-release.apk
            Cheghad-store-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}